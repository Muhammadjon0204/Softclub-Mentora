# Сборка образов и деплой на сервер.
#
# Образы собираются здесь, а не на сервере: `dotnet publish` из SDK-образа плюс
# `npm ci` съедают на VPS больше двух гигабайт и минуты времени, и всё это на
# машине, которая в этот момент обслуживает остальные проекты.
#
# Секреты репозитория:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#   SERVER_IP_ADDRESS, SERVER_USERNAME, SSH_KEY, SERVER_SSH_PORT
#   SERVER_PROJECT_FOLDER
#
# Job deploy не запускается, пока в переменных репозитория (Settings → Variables)
# не появится DEPLOY_ENABLED=true. До этого workflow только собирает и публикует
# образы, ничего не трогая на сервере.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./Backend
            image: mentora-api
            build_args: ""
          # Адрес API вшивается в бандл на этапе сборки, поэтому образ фронта
          # привязан к домену и значение обязано прийти сюда. Задаётся
          # переменной репозитория VITE_API_BASE_URL (Settings → Variables),
          # например https://api.mentora.example.com/api/v1
          - name: web
            context: ./Frontend
            image: mentora-web
            build_args: VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Два тега: latest — то, что тянет сервер, и sha — чтобы был откат к
      # конкретному коммиту без пересборки.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy to server
    runs-on: ubuntu-latest
    needs: build
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}

    steps:
      # git pull нужен ради самого docker-compose.api.yml и скрипта инициализации
      # ролей, который монтируется с диска. .env лежит только на сервере и в git
      # не отслеживается, поэтому pull его не трогает.
      #
      # `up -d` без --build: образы уже собраны выше. Мигратор пересоздаётся сам,
      # когда меняется образ API, и остальные ждут его через
      # service_completed_successfully. `down` не делаем — он давал бы простой
      # на всё время pull и старта.
      - name: Pull images and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP_ADDRESS }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.SERVER_PROJECT_FOLDER }}
            git pull --ff-only
            docker compose --env-file .env.api -f docker-compose.api.yml pull
            docker compose --env-file .env.api -f docker-compose.api.yml up -d --no-build

            docker compose --env-file .env.web -f docker-compose.web.yml pull
            docker compose --env-file .env.web -f docker-compose.web.yml up -d --no-build

            docker compose --env-file .env.api -f docker-compose.api.yml ps
            docker compose --env-file .env.web -f docker-compose.web.yml ps
            docker image prune -f
