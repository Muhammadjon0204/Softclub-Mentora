# CI: сборка → тесты → спецификация OpenAPI → сборка образов.
#
# Файл лежит в корне репозитория намеренно: GitHub Actions читает только
# корневой .github/workflows, поэтому прежняя копия в Backend/.github никогда
# не запускалась.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Backend/global.json

      - name: Restore
        run: dotnet restore MentorTaskFlow.sln

      # NuGetAudit включён, NU1903/NU1904 — ошибки (SEC-014): зависимость с
      # известной High/Critical уязвимостью роняет сборку здесь, а не доезжает
      # до образа.
      - name: Build
        run: dotnet build MentorTaskFlow.sln --configuration Release --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/MentorTaskFlow.UnitTests/MentorTaskFlow.UnitTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      # Быстрые и без зависимостей: нарушение слоёв не должно обнаруживаться
      # только после медленного интеграционного набора.
      - name: Architecture tests
        run: >
          dotnet test tests/MentorTaskFlow.ArchitectureTests/MentorTaskFlow.ArchitectureTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=architecture.trx" --results-directory TestResults

      # Testcontainers поднимает PostgreSQL и MinIO на демоне раннера.
      - name: Integration tests
        run: >
          dotnet test tests/MentorTaskFlow.IntegrationTests/MentorTaskFlow.IntegrationTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Backend/TestResults/*.trx

  # Отдельная job, потому что сборка фронта — ровно то, что молча падало:
  # на сервере контейнер mentora_web не существовал вовсе, а причина
  # обнаруживалась только в логе ручного `docker compose build`.
  # `npm run build` здесь — это tsc --noEmit + vite build + verify:bundle.
  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ""

  openapi:
    name: openapi specification
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Backend/global.json

      # API-002: спецификация генерируется из кода и публикуется артефактом.
      #
      # `swagger tofile` поднимает настоящий хост, чтобы прочитать документ,
      # поэтому работает валидация старта: каждая группа настроек с
      # ValidateOnStart обязана удовлетворить свои [Required] (DEPLOY-015).
      # Значения ниже — заглушки, нужные только чтобы хост стартовал: токен не
      # выдаётся, база не опрашивается, бакет и почтовый сервер не открываются.
      #
      # Новая [Required] настройка означает новую строку здесь — иначе job
      # перестанет выдавать спецификацию. Это осознанный размен: DEPLOY-015
      # требует падения на старте при отсутствующей настройке, а обратный путь —
      # ослабить требование ради зелёного CI.
      - name: Generate OpenAPI specification
        env:
          Auth__JwtSigningKey: openapi-generation-only-0123456789-abcdefghijklmnopqrstuvwxyz
          Auth__AppBaseUrl: https://app.invalid
          ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=1;Database=openapi;Username=none;Password=none"
          # Порт 1: конфигурация корректна, сервер недостижим. Никто сюда не ходит.
          Storage__Endpoint: "http://127.0.0.1:1"
          Storage__AccessKey: openapi-generation-only
          Storage__SecretKey: openapi-generation-only
          Notifications__SmtpHost: 127.0.0.1
        run: |
          dotnet tool install --global Swashbuckle.AspNetCore.Cli --version 10.2.3
          dotnet build src/MentorTaskFlow.Api/MentorTaskFlow.Api.csproj --configuration Release
          swagger tofile --output openapi-v1.json \
            src/MentorTaskFlow.Api/bin/Release/net10.0/MentorTaskFlow.Api.dll v1

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: Backend/openapi-v1.json

  images:
    name: build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./Backend
          - name: web
            context: ./Frontend

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t mentora-${{ matrix.name }}:${{ github.sha }} ${{ matrix.context }}

      # SEC-014: сканируется не только граф зависимостей, но и образ. Critical и
      # High роняют job — образ с известной эксплуатируемой уязвимостью не едет
      # дальше. Версия закреплена точно: сканер, молча меняющий поведение, —
      # худшее место для сюрприза в цепочке поставки.
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mentora-${{ matrix.name }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
