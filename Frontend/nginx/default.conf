# MentorTaskFlow SPA — конфиг nginx внутри контейнера mentora_web.
#
# Контейнер раздаёт статику и больше ничего не делает. Проксирования на API
# здесь намеренно нет: браузер ходит в API напрямую по адресу api.<домен>,
# который разводит хостовый nginx. Поэтому фронт не знает о существовании
# контейнера mentora_api, живёт в отдельном compose-проекте и деплоится
# независимо от бэкенда.
#
# Добавлять сюда `proxy_pass http://mentora_api:8080` нельзя: имя апстрима
# nginx резолвит один раз при загрузке конфига, а контейнера с таким именем в
# этой сети нет — nginx не запустится вовсе с «host not found in upstream».

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Сжатие -------------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # --- Статика с хешем в имени --------------------------------------------
    # Vite добавляет к JS/CSS/картинкам content hash, поэтому их можно кэшировать
    # навсегда: новая сборка — новое имя файла.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Точка входа SPA ----------------------------------------------------
    # index.html кэшировать нельзя: он ссылается на файлы с хешем, и закэшированная
    # копия после деплоя тянула бы ассеты, которых в образе уже нет — белый экран
    # у всех, кто заходил раньше.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # --- Fallback роутера ---------------------------------------------------
    # Любой путь, который не является файлом, отдаёт index.html — дальше маршрут
    # разбирает React Router на клиенте.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
