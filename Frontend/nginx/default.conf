# MentorTaskFlow SPA — nginx site config.
#
# Responsibilities:
#   1. Serve the compiled Vite bundle (HTML, JS, CSS, static assets).
#   2. Fall back to index.html for any path the client-side router owns.
#   3. Proxy /api/* to the backend container (mtf-api) so the SPA never
#      needs a cross-origin request.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # --- Static assets with hashed filenames ---------------------------------
    # Vite adds content hashes to JS/CSS/images, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- API reverse proxy ---------------------------------------------------
    # Strips nothing: /api/v1/foo → mtf-api:8080/api/v1/foo as-is.
    location /api/ {
        proxy_pass         http://mtf-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (if needed later for SignalR).
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Reasonable timeouts for long-running requests (AI summaries, reports).
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- SPA fallback --------------------------------------------------------
    # Any route that is not a real file or the API gets index.html,
    # so React Router can handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
