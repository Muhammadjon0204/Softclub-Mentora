# MentorTaskFlow — unified production deployment (Backend + Frontend).
#
# Usage:
#   cp .env.example .env        # fill in all values
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Architecture:
#   mtf-web   (nginx:80)  ── serves SPA, proxies /api/* ──▶ mtf-api (8080)
#   mtf-api   (.NET)      ── REST API, no Hangfire server
#   mtf-worker (.NET)     ── Hangfire server, email/Telegram notifications
#   mtf-migrator (.NET)   ── runs once: migrations + bootstrap
#   postgres  (16)        ── main database
#   minio     (S3)        ── file storage

name: mentortaskflow-prod

services:

  # ── Database ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./Backend/scripts/db/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Object storage ────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # ── Migrator (run-once) ───────────────────────────────────────────────────
  mtf-migrator:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    command: ["--migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING_MIGRATOR}
      Auth__JwtSigningKey: ${AUTH_JWT_SIGNING_KEY}
      Auth__AppBaseUrl: ${CORS_ALLOWED_ORIGIN}
      Bootstrap__OrganizationName: ${BOOTSTRAP_ORGANIZATION_NAME}
      Bootstrap__OrganizationSlug: ${BOOTSTRAP_ORGANIZATION_SLUG}
      Bootstrap__HeadOfficeName: ${BOOTSTRAP_HEAD_OFFICE_NAME}
      Bootstrap__HeadOfficeCode: ${BOOTSTRAP_HEAD_OFFICE_CODE}
      Bootstrap__HeadOfficeTimeZone: ${BOOTSTRAP_HEAD_OFFICE_TIMEZONE:-Asia/Dushanbe}
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL}
    restart: "no"

  # ── API ───────────────────────────────────────────────────────────────────
  mtf-api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mtf-migrator:
        condition: service_completed_successfully
      minio:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING_APP}
      Database__MigrateOnStartup: "false"
      Hangfire__EnableServer: "false"
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN}
      Auth__JwtSigningKey: ${AUTH_JWT_SIGNING_KEY}
      Auth__AppBaseUrl: ${CORS_ALLOWED_ORIGIN}
      Storage__Endpoint: http://minio:9000
      Storage__PublicEndpoint: ${STORAGE_PUBLIC_ENDPOINT:-http://minio:9000}
      Storage__AccessKey: ${MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
      Storage__Bucket: ${STORAGE_BUCKET:-mentortaskflow}
      Storage__EnsureBucketOnStartup: "true"
      Telegram__Enabled: ${TELEGRAM_ENABLED:-false}
      Telegram__BotUsername: ${TELEGRAM_BOT_USERNAME:-}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Telegram__WebhookSecret: ${TELEGRAM_WEBHOOK_SECRET:-}
      Ai__Enabled: ${AI_ENABLED:-false}
      Ai__ApiKey: ${AI_API_KEY:-}
      Ai__ModelId: ${AI_MODEL_ID:-claude-sonnet-5}
      Ai__PromptVersion: ${AI_PROMPT_VERSION:-v1.0}
      Metrics__Enabled: "true"
    # Not exposed to the host — mtf-web proxies to this container on the Docker network.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Background worker ─────────────────────────────────────────────────────
  mtf-worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mtf-migrator:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      MTF_ROLE: worker
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING_APP}
      Database__MigrateOnStartup: "false"
      Hangfire__EnableServer: "true"
      Auth__JwtSigningKey: ${AUTH_JWT_SIGNING_KEY}
      Notifications__EnableWorker: "true"
      Notifications__SmtpHost: ${SMTP_HOST:-}
      Notifications__SmtpPort: ${SMTP_PORT:-587}
      Notifications__SmtpUser: ${SMTP_USER:-}
      Notifications__SmtpPassword: ${SMTP_PASSWORD:-}
      Notifications__SmtpUseSsl: "true"
      Notifications__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Notifications__AppBaseUrl: ${CORS_ALLOWED_ORIGIN}
      Telegram__Enabled: ${TELEGRAM_ENABLED:-false}
      Telegram__BotUsername: ${TELEGRAM_BOT_USERNAME:-}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Scheduler__Enabled: "true"
      Scheduler__EnableServer: "true"
    restart: unless-stopped

  # ── Frontend (SPA via nginx) ──────────────────────────────────────────────
  mtf-web:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      mtf-api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
